<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#f0f8ff"/>

  <!-- Dog body (left side) -->
  <ellipse cx="150" cy="250" rx="80" ry="60" fill="#8B4513" stroke="#654321" stroke-width="2"/>

  <!-- Cat body (right side) -->
  <ellipse cx="250" cy="250" rx="80" ry="60" fill="#FF8C00" stroke="#CC6600" stroke-width="2"/>

  <!-- Merged body center -->
  <ellipse cx="200" cy="250" rx="90" ry="65" fill="#B8734D" stroke="#8B5A3C" stroke-width="2"/>

  <!-- Head -->
  <circle cx="200" cy="150" r="70" fill="#B8734D" stroke="#8B5A3C" stroke-width="2"/>

  <!-- Dog ear (left, floppy) -->
  <ellipse cx="150" cy="120" rx="25" ry="40" fill="#8B4513" stroke="#654321" stroke-width="2" transform="rotate(-30 150 120)"/>

  <!-- Cat ear (right, pointed) -->
  <path d="M 230 90 L 250 70 L 260 100 Z" fill="#FF8C00" stroke="#CC6600" stroke-width="2"/>
  <path d="M 240 85 L 250 75 L 252 92 Z" fill="#FFB6C1"/>

  <!-- Dog snout (left side) -->
  <ellipse cx="180" cy="170" rx="20" ry="15" fill="#A0826D" stroke="#8B5A3C" stroke-width="1"/>

  <!-- Cat snout (right side) -->
  <ellipse cx="220" cy="170" rx="18" ry="13" fill="#D2691E" stroke="#A0522D" stroke-width="1"/>

  <!-- Nose (merged) -->
  <ellipse cx="200" cy="175" rx="8" ry="6" fill="#000000"/>

  <!-- Mouth -->
  <path d="M 200 175 Q 195 185 190 183" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M 200 175 Q 205 185 210 183" stroke="#000000" stroke-width="2" fill="none"/>

  <!-- Dog eye (left) -->
  <circle cx="180" cy="145" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <circle cx="182" cy="145" r="6" fill="#4B3621"/>
  <circle cx="184" cy="143" r="3" fill="#000000"/>
  <circle cx="185" cy="142" r="1" fill="#FFFFFF"/>

  <!-- Cat eye (right) -->
  <ellipse cx="220" cy="145" rx="12" ry="15" fill="#90EE90" stroke="#000000" stroke-width="1"/>
  <ellipse cx="220" cy="148" rx="4" ry="8" fill="#000000"/>
  <ellipse cx="221" cy="145" rx="2" ry="3" fill="#FFFFFF"/>

  <!-- Whiskers (cat side) -->
  <line x1="230" y1="165" x2="280" y2="160" stroke="#000000" stroke-width="1"/>
  <line x1="230" y1="170" x2="285" y2="170" stroke="#000000" stroke-width="1"/>
  <line x1="230" y1="175" x2="280" y2="180" stroke="#000000" stroke-width="1"/>

  <!-- Whiskers (dog side - shorter) -->
  <line x1="170" y1="165" x2="130" y2="162" stroke="#000000" stroke-width="1"/>
  <line x1="170" y1="170" x2="125" y2="170" stroke="#000000" stroke-width="1"/>

  <!-- Dog leg (front left) -->
  <rect x="140" y="290" width="20" height="50" rx="5" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <ellipse cx="150" cy="340" rx="12" ry="8" fill="#654321"/>

  <!-- Cat leg (front right) -->
  <rect x="240" y="290" width="18" height="50" rx="4" fill="#FF8C00" stroke="#CC6600" stroke-width="2"/>
  <ellipse cx="249" cy="340" rx="11" ry="7" fill="#CC6600"/>

  <!-- Middle legs -->
  <rect x="185" y="290" width="18" height="50" rx="4" fill="#B8734D" stroke="#8B5A3C" stroke-width="2"/>
  <ellipse cx="194" cy="340" rx="11" ry="7" fill="#8B5A3C"/>

  <!-- Dog tail (left, wagging up) -->
  <path d="M 120 240 Q 90 220 85 190" stroke="#8B4513" stroke-width="15" fill="none" stroke-linecap="round"/>

  <!-- Cat tail (right, curved) -->
  <path d="M 280 240 Q 320 230 330 200 Q 335 180 325 165" stroke="#FF8C00" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Title -->
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333333">
    Cat-Dog Infusion
  </text>

  <!-- Paw prints decoration -->
  <g transform="translate(50, 50)" opacity="0.3">
    <ellipse cx="0" cy="0" rx="6" ry="8" fill="#8B4513"/>
    <circle cx="-5" cy="-8" r="3" fill="#8B4513"/>
    <circle cx="5" cy="-8" r="3" fill="#8B4513"/>
    <circle cx="-3" cy="-12" r="2.5" fill="#8B4513"/>
    <circle cx="3" cy="-12" r="2.5" fill="#8B4513"/>
  </g>

  <g transform="translate(350, 80)" opacity="0.3">
    <ellipse cx="0" cy="0" rx="6" ry="8" fill="#FF8C00"/>
    <circle cx="-5" cy="-8" r="3" fill="#FF8C00"/>
    <circle cx="5" cy="-8" r="3" fill="#FF8C00"/>
    <circle cx="-3" cy="-12" r="2.5" fill="#FF8C00"/>
    <circle cx="3" cy="-12" r="2.5" fill="#FF8C00"/>
  </g>
</svg>
